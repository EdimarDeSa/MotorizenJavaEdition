server:
  address: 127.0.0.1
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: motorizen-backend
    version: ${APP_VERSION:0.1.0}
  datasource:
    url: jdbc:h2:mem:motorizen_test
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:motorizen-redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:admin}
      password: ${REDIS_PASSWORD:admin}
  rabbitmq:
    host: ${RABBITMQ_HOST:motorizen-rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

logging:
  level:
    root: INFO
    '[com.efscode.motorizen_backend]': INFO

app:
  info:
    name: "Motorizen Api"
    version: ${APP_VERSION:0.1.0}
    description: "Motorizen Api"
  security:
    jwt:
      secret: suaChaveSecretaMuitoLonga
      expiration: ${APP_SECURITY_JWT_EXPIRATION:3600}
      refreshSecret: suaChaveSecretaMuitoLonga2
      refreshExpiration: ${APP_SECURITY_JWT_REFRESH_EXPIRATION:86400}
      issuer: "motorizen_dev"
