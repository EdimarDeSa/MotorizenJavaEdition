spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://motorizen-postgres:5432/motorizen_java_edition}
    username: ${DB_USERNAME:motorizenapiteste}
    password: ${DB_PASSWORD:motorizenapiteste}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:motorizen-redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:admin}
      password: ${REDIS_PASSWORD:admin}
  rabbitmq:
    host: ${RABBITMQ_HOST:motorizen-rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  security:
    user:
      name: admin
      password: $2a$12$glDdI7XriCKPr/KfzQAb3.rH.FjFyxw9RwzIRPl1A4hA6vAKLTXme
      roles:
        - administrator
        - user

logging:
  level:
    root: ERROR
    "[com.efscode.motorizen_backend]": DEBUG

app:
  info:
    name: "Motorizen Api"
    version: ${APP_VERSION:0.1.0}
    description: "Motorizen Api"
  security:
    jwt:
      secret: suaChaveSecretaMuitoLonga
      expiration: ${APP_SECURITY_JWT_EXPIRATION:3600}
      refreshSecret: suaChaveSecretaMuitoLonga2
      refreshExpiration: ${APP_SECURITY_JWT_REFRESH_EXPIRATION:86400}
      issuer: "motorizen_dev"
